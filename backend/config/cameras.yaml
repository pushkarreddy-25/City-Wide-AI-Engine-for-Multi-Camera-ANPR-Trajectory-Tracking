# Camera network configuration
# Coordinates approximate real Nagpur intersections. `stop_line_y`,
# `pixels_per_meter` and `lanes` describe each camera's calibration and are
# used by the violation-detection and speed-estimation modules.
#
# To add a camera: add an entry under `cameras` and connect it in
# `network.edges`. No code changes are required (see SRS NFR 2.4 Scalability).

cameras:
  cam_1:
    name: "Sitabuldi Intersection"
    latitude: 21.1458
    longitude: 79.0882
    rtsp_url: "rtsp://demo/cam_1"        # placeholder; simulation-mode ignores this
    stop_line_y: 450
    pixels_per_meter: 2.5
    speed_limit_kmh: 50
    lanes: [120, 260, 400]

  cam_2:
    name: "Dhantoli Intersection"
    latitude: 21.1402
    longitude: 79.0925
    rtsp_url: "rtsp://demo/cam_2"
    stop_line_y: 420
    pixels_per_meter: 2.3
    speed_limit_kmh: 40
    lanes: [110, 240, 370]

  cam_3:
    name: "Nagpur Square (Variety)"
    latitude: 21.1497
    longitude: 79.0806
    rtsp_url: "rtsp://demo/cam_3"
    stop_line_y: 470
    pixels_per_meter: 2.6
    speed_limit_kmh: 50
    lanes: [130, 280, 430]

  cam_4:
    name: "Ajni Square"
    latitude: 21.1315
    longitude: 79.0888
    rtsp_url: "rtsp://demo/cam_4"
    stop_line_y: 440
    pixels_per_meter: 2.4
    speed_limit_kmh: 60
    lanes: [100, 230, 360]

  cam_5:
    name: "Sadar Bazaar"
    latitude: 21.1585
    longitude: 79.0855
    rtsp_url: "rtsp://demo/cam_5"
    stop_line_y: 430
    pixels_per_meter: 2.5
    speed_limit_kmh: 40
    lanes: [115, 250, 385]

# Road network: undirected edges connecting adjacent intersections.
# The simulator routes vehicles along these edges; the linking module uses
# them (plus haversine distance) to sanity-check cross-camera travel.
network:
  edges:
    - [cam_3, cam_1]
    - [cam_1, cam_2]
    - [cam_1, cam_5]
    - [cam_2, cam_4]
    - [cam_3, cam_5]
