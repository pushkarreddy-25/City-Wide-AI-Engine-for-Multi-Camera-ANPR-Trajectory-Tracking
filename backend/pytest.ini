[pytest]
# Run from the backend/ directory:  pytest
# `pythonpath = .` puts backend/ on sys.path so tests can `import utils`, `db`, `api`.
pythonpath = .
testpaths = tests
addopts = -q
filterwarnings =
    # FastAPI/Starlette on_event startup hooks are deprecated in favour of
    # lifespan handlers; silence the noise so the suite output stays readable.
    ignore::DeprecationWarning
